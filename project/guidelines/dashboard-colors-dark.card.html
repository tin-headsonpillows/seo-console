<!-- @dsCard group="Dashboard" viewport="700x140" name="Dark Palette" subtitle="the .db-dark modifier — a settings toggle, not prefers-color-scheme" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--db-font-sans)}#root{padding:16px;display:flex;gap:8px}.sw{flex:1;height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;box-sizing:border-box}</style>
<div id="root" class="db-scope db-dark" style="background:var(--db-bg);padding-bottom:1px">
<div class="sw" style="background:var(--db-surface);border:1px solid var(--db-border)">surface</div>
<div class="sw" style="background:var(--db-accent)">accent</div>
<div class="sw" style="background:var(--db-accent-soft);color:var(--db-fg)">accent-soft</div>
<div class="sw" style="background:var(--db-good)">good</div>
<div class="sw" style="background:var(--db-bad)">bad</div>
</div>
