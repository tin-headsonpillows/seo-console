<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}#root{padding:16px;display:flex;flex-direction:column;gap:2px}.b{height:16px;display:flex;align-items:center;padding-left:8px;border:1px solid var(--border-hairline-soft)}</style>
<div id="root">
<div class="b" style="background:var(--surface-canvas)">white — hero</div>
<div class="b" style="background:var(--surface-card);border:none">gray — feature cards</div>
<div class="b" style="background:var(--surface-canvas)">white — product mockup</div>
<div class="b" style="background:var(--surface-card);border:none">gray — CTA band</div>
<div class="b" style="background:var(--surface-dark);color:#fff;border:none">dark — footer</div>
</div>
