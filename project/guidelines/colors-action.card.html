<!-- @dsCard group="Colors" viewport="700x120" name="Action & Text" subtitle="Primary CTA scale + ink/body/muted text" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans)}#root{padding:16px;display:flex;gap:10px}.sw{flex:1;height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-family:var(--font-mono);box-sizing:border-box}</style>
<div id="root">
<div class="sw" style="background:var(--color-primary);color:#fff">primary #111</div>
<div class="sw" style="background:var(--color-primary-active);color:#fff">active #242424</div>
<div class="sw" style="background:var(--color-primary-disabled);color:var(--text-muted)">disabled</div>
<div class="sw" style="background:var(--text-ink);color:#fff">ink</div>
<div class="sw" style="background:var(--text-body);color:#fff">body</div>
<div class="sw" style="background:var(--text-muted);color:#fff">muted</div>
<div class="sw" style="background:var(--text-muted-soft);color:#fff">muted-soft</div>
</div>
