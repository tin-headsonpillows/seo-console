<!-- @dsCard group="Brand" viewport="700x150" name="Radius Scale" subtitle="xs 4 → sm 6 → md 8 → lg 12 → xl 16 → pill/full" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}#root{padding:16px;display:flex;gap:14px;align-items:flex-end}.b{background:var(--surface-strong);width:64px;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box}</style>
<div id="root">
<div class="b" style="border-radius:var(--radius-xs)">xs 4</div>
<div class="b" style="border-radius:var(--radius-sm)">sm 6</div>
<div class="b" style="border-radius:var(--radius-md)">md 8</div>
<div class="b" style="border-radius:var(--radius-lg)">lg 12</div>
<div class="b" style="border-radius:var(--radius-xl)">xl 16</div>
<div class="b" style="border-radius:var(--radius-full);width:64px">full</div>
</div>
