<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base unit, xxs–section" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}#root{padding:16px;display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:10px}.bar{background:var(--color-primary);height:12px}</style>
<div id="root">
<div class="row"><div class="bar" style="width:var(--space-xxs)"></div>xxs 4px</div>
<div class="row"><div class="bar" style="width:var(--space-xs)"></div>xs 8px</div>
<div class="row"><div class="bar" style="width:var(--space-sm)"></div>sm 12px</div>
<div class="row"><div class="bar" style="width:var(--space-md)"></div>md 16px</div>
<div class="row"><div class="bar" style="width:var(--space-lg)"></div>lg 24px</div>
<div class="row"><div class="bar" style="width:var(--space-xl)"></div>xl 32px</div>
<div class="row"><div class="bar" style="width:var(--space-xxl)"></div>xxl 48px</div>
<div class="row"><div class="bar" style="width:96px"></div>section 96px</div>
</div>
