<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono)}#root{padding:16px;display:flex;gap:10px}.sw{flex:1;height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:11px;box-sizing:border-box;border:1px solid var(--border-hairline)}</style>
<div id="root">
<div class="sw" style="background:var(--surface-canvas)">canvas</div>
<div class="sw" style="background:var(--surface-soft)">soft</div>
<div class="sw" style="background:var(--surface-card)">card</div>
<div class="sw" style="background:var(--surface-strong)">strong</div>
<div class="sw" style="background:var(--surface-dark);color:#fff;border:none">dark</div>
<div class="sw" style="background:var(--surface-dark-elevated);color:#fff;border:none">dark elevated</div>
</div>
