<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--db-font-sans)}#root{padding:16px;display:flex;gap:8px}.sw{flex:1;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff}</style>
<div id="root" class="db-scope">
<div class="sw" style="background:var(--db-clicks)">clicks</div>
<div class="sw" style="background:var(--db-impressions)">impressions</div>
<div class="sw" style="background:var(--db-ctr)">ctr</div>
<div class="sw" style="background:var(--db-position)">position</div>
</div>
