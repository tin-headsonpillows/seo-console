<div id="root"></div>
<script type="text/babel">
const { FeatureCard, FeatureIconCard, ProductMockupCard, CustomerProofCard, PricingTierCard, HeroAppMockupCard, CtaBandLight, Avatar, Icon } = window.SEOConsoleDesignSystem_8b9179;
function App(){

  return (
    <React.Fragment>

}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
