<!-- @dsCard group="Marketing Site" viewport="1200x900" name="Marketing Site" subtitle="Homepage, pricing, resources, login — click-through" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SEO Console — Marketing Site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:var(--surface-canvas)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./fragments.jsx"></script>
<script type="text/babel" src="./chrome.jsx"></script>
<script type="text/babel" src="./Homepage.jsx"></script>
<script type="text/babel" src="./PricingPage.jsx"></script>
<script type="text/babel" src="./ResourcesPage.jsx"></script>
<script type="text/babel" src="./LoginPage.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState("home");
  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  }, [route]);
  const pages = { home: window.Homepage, pricing: window.PricingPage, resources: window.ResourcesPage, login: window.LoginPage };
  const Page = pages[route];
  const activeHref = { home: null, pricing: "#pricing", resources: "#resources", login: null }[route];
  return (
    <div>
      {route !== "login" ? <window.SiteNav activeHref={activeHref} onNavigate={setRoute} /> : null}
      <div style={{ display: "flex", gap: "8px", justifyContent: "center", padding: "10px", background: "var(--surface-soft)", fontFamily: "var(--nav-link-family)", fontSize: "13px" }}>
        {["home", "pricing", "resources", "login"].map((r) => (
          <button key={r} onClick={() => setRoute(r)} style={{ background: "none", border: "none", cursor: "pointer", textDecoration: r === route ? "underline" : "none", color: "var(--text-muted)", padding: "4px 8px" }}>
            {r}
          </button>
        ))}
      </div>
      <Page onNavigate={setRoute} />
      {route !== "login" ? <window.SiteFooter /> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
